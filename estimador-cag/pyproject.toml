[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio FastAPI que estima proyectos de software a partir de transcripciones de reuniones, con arquitectura CAG"
readme = "README.md"
authors = [{ name = "Juliana Amézquita" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
